name: One-off 2027 programme regeneration
on:
  push:
    branches:
      - prince2-2027-baseline
    paths:
      - .github/workflows/rebuild-2027-programme.yml
permissions:
  contents: write
concurrency:
  group: rebuild-2027-programme
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: prince2-2027-baseline
          fetch-depth: 0
      - name: Run the repository's deterministic builder
        run: python3 tools/build_2027_plan.py
      - name: Validate outputs and determinism
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import subprocess

          root = pathlib.Path("projects/public/2027-foi-programme")
          jp, hp = root / "programme.json", root / "index.html"
          data = json.loads(jp.read_text(encoding="utf-8"))
          page = hp.read_text(encoding="utf-8")
          assert data["schema"] == "cedwyn-prince2-programme/1.1.0"
          assert data["status"] == "DRAFT_BASELINE_FOR_G0"
          assert data["counts"] == {
              "lanes": 88, "tasks": 1408,
              "by_tier": {"1": 15, "2": 35, "3": 15, "4": 23},
          }, data.get("counts")
          assert len(data["institutions"]) == 88
          task_ids = [task["id"] for lane in data["institutions"] for task in lane["tasks"]]
          assert len(task_ids) == 1408 and len(set(task_ids)) == 1408
          assert all(task.get("planned_start") and task.get("planned_finish")
                     and task.get("product_id") for lane in data["institutions"]
                     for task in lane["tasks"])
          assert "PLACEHOLDER_TOO_LARGE" not in jp.read_text(encoding="utf-8")
          assert "PLACEHOLDER_TOO_LARGE" not in page
          assert "Institutional focus:" not in page
          assert page.count('id="sp27-') == 88
          assert all(section in page for section in (
              'id="plan-on-a-page"', 'id="business-case"', 'id="tolerances"',
              'id="product-breakdown"', 'id="raid-2027"', 'id="dependencies-2027"',
              'id="stages"',
          ))
          first = (jp.read_bytes(), hp.read_bytes())
          subprocess.run(["python3", "tools/build_2027_plan.py"], check=True)
          second = (jp.read_bytes(), hp.read_bytes())
          assert first == second, "Builder output is not byte-identical on its second run"
          print("PASS: 88 lanes; 1,408 unique dated/product-linked tasks; tier split 15/35/15/23.")
          print(f"programme.json: {len(first[0]):,} bytes")
          print(f"index.html: {len(first[1]):,} bytes")
          print("PASS: placeholders absent; HTML compacted; second run byte-identical.")
          PY
      - name: Commit generated pages and remove this one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/public/2027-foi-programme/programme.json projects/public/2027-foi-programme/index.html
          git rm .github/workflows/rebuild-2027-programme.yml
          git commit -m "Restore generated 2027 programme pages (#30)"
          git push origin HEAD:refs/heads/prince2-2027-baseline
