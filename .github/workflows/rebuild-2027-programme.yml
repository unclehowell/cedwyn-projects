name: One-off 2027 programme regeneration
on:
  push:
    branches:
      - prince2-2027-baseline
    paths:
      - .github/workflows/rebuild-2027-programme.yml
permissions:
  contents: write
concurrency:
  group: rebuild-2027-programme
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: prince2-2027-baseline
          fetch-depth: 0
      - name: Run the canonical builder
        run: python3 tools/build_2027_plan.py
      - name: Validate calendar entry point, cost and send ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          root = pathlib.Path("projects/public/2027-foi-programme")
          jp, hp = root / "programme.json", root / "index.html"
          data = json.loads(jp.read_text(encoding="utf-8"))
          page = hp.read_text(encoding="utf-8")
          assert data["schema"] == "cedwyn-prince2-programme/1.1.0"
          assert data["status"] == "DRAFT_BASELINE_FOR_G0"
          assert data["counts"] == {
              "lanes": 88, "tasks": 1408,
              "by_tier": {"1": 15, "2": 35, "3": 15, "4": 23},
          }, data.get("counts")
          assert "≤ 2 outbound sends per working day" in json.dumps(data["tolerances"], ensure_ascii=False)
          cost = next(x for x in data["tolerances"] if x["area"] == "Cost")
          assert "£0" in cost["programme"] and "£0" in cost["lane"]
          assert "/2027-foi-programme/calendar/" in page
          assert "PLACEHOLDER_TOO_LARGE" not in jp.read_text(encoding="utf-8")
          assert "PLACEHOLDER_TOO_LARGE" not in page
          first = (jp.read_bytes(), hp.read_bytes())
          subprocess.run(["python3", "tools/build_2027_plan.py"], check=True)
          second = (jp.read_bytes(), hp.read_bytes())
          assert first == second, "Builder is not deterministic on second run"
          print("PASS: 88 lanes / 1,408 tasks; tier split 15/35/15/23.")
          print("PASS: £0 cost tolerance and two outbound messages per working day.")
          print("PASS: calendar navigation link is included.")
          print(f"programme.json: {len(first[0]):,} bytes")
          print(f"index.html: {len(first[1]):,} bytes")
          print("PASS: second build is byte-identical.")
          PY
      - name: Commit pages and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/public/2027-foi-programme/programme.json projects/public/2027-foi-programme/index.html
          git rm .github/workflows/rebuild-2027-programme.yml
          git commit -m "Refresh 2027 programme calendar link and two-message limit"
          git push origin HEAD:refs/heads/prince2-2027-baseline
