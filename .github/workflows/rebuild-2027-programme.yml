name: One-off 2027 programme baseline refresh
on:
  push:
    branches:
      - prince2-2027-baseline
    paths:
      - .github/workflows/rebuild-2027-programme.yml
permissions:
  contents: write
concurrency:
  group: rebuild-2027-programme
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prince2-2027-baseline
          fetch-depth: 0
      - name: Run canonical builder
        run: python3 tools/build_2027_plan.py
      - name: Validate, then confirm deterministic output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          root = pathlib.Path("projects/public/2027-foi-programme")
          jp, hp = root/"programme.json", root/"index.html"
          d = json.loads(jp.read_text(encoding="utf-8"))
          html = hp.read_text(encoding="utf-8")
          assert d["counts"] == {"lanes":88,"tasks":1408,"by_tier":{"1":15,"2":35,"3":15,"4":23}}
          assert d["schema"] == "cedwyn-prince2-programme/1.1.0"
          t = {x["area"]:x for x in d["tolerances"]}
          assert "£0" in t["Cost"]["programme"] and "PAUSE" in t["Cost"]["lane"]
          assert "≤ 2 outbound messages per working day" in t["Executive load"]["programme"]
          assert "five hours" not in t["Executive load"]["programme"].lower()
          assert "PAUSE" in d["business_case"]["investment_appraisal"] and "NO SPEND" in d["business_case"]["investment_appraisal"]
          assert "2027-foi-programme/calendar/" in html
          before=(jp.read_bytes(),hp.read_bytes())
          subprocess.run(["python3","tools/build_2027_plan.py"],check=True)
          assert before==(jp.read_bytes(),hp.read_bytes())
          print("PASS: 88/1,408; £0 hard stop; two outbound messages/day; time measured without an unapproved hours cap.")
          print("PASS: calendar linked; second build byte-identical.")
          print("programme.json",len(before[0]),"bytes; index.html",len(before[1]),"bytes")
          PY
      - name: Commit generated programme pages and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/public/2027-foi-programme/programme.json projects/public/2027-foi-programme/index.html
          git rm .github/workflows/rebuild-2027-programme.yml
          git commit -m "Refresh zero-spend and time-use controls in 2027 programme"
          git push origin HEAD:refs/heads/prince2-2027-baseline
